<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SwiftBill - Reset Password</title>
  
  <!-- Design System CSS Imports -->
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/variables.css" />
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body>
  <div class="page-wrapper">
    <!-- Brand Header -->
    <header class="brand-header">
      <div class="brand-wrapper">
        <span class="brand-logo">SB</span>
        <h1 class="brand-title">SwiftBill</h1>
        <span class="brand-tagline">Password Reset</span>
      </div>
    </header>

    <!-- Main Container -->
    <main class="auth-container">
      <div class="card-container space-y-4">
        
        <!-- Header Section -->
        <div>
          <h2 class="form-title">Set New Password</h2>
          <p class="form-subtitle">Enter your new credentials to restore account access.</p>
        </div>

        <!-- Alert Banner -->
        <div id="alertBanner" class="hidden"></div>

        <!-- Password Reset Form -->
        <form id="resetPasswordForm" class="space-y-3">
          <div>
            <label for="newPassword" class="form-label">New Password</label>
            <input 
              type="password" 
              id="newPassword" 
              class="form-input" 
              placeholder="••••••••" 
              required 
            />
          </div>

          <div>
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input 
              type="password" 
              id="confirmPassword" 
              class="form-input" 
              placeholder="••••••••" 
              required 
            />
          </div>

          <button type="submit" class="btn-green btn-full text-sm">
            Update Password
          </button>
        </form>

        <!-- Back to Login Navigation -->
        <div class="bottom-link text-center">
          <a href="auth.html" class="link-btn">Return to Login</a>
        </div>

      </div>
    </main>

    <!-- Footer -->
    <footer>
      &copy; 2026 SwiftBill Portal. All rights reserved.
    </footer>
  </div>

  <!-- API Integration Script -->
  <script src="../js/api.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");
      const form = document.getElementById("resetPasswordForm");
      const alertBanner = document.getElementById("alertBanner");

      if (!token) {
        console.warn("No token found in URL parameters. Operating in a test mode.");
        // alertBanner.textContent = "Invalid or missing reset token.";
        // alertBanner.className = "alert-error";
        // alertBanner.classList.remove("hidden");
        // form.style.display = "none";
        return;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        
        // Clear active alerts
        alertBanner.classList.add("hidden");
        alertBanner.textContent = "";

        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (newPassword !== confirmPassword) {
          alertBanner.textContent = "Passwords do not match.";
          alertBanner.className = "alert-error";
          alertBanner.classList.remove("hidden");
          return;
        }

        try {
          const response = await apiRequest("/auth/reset-password", "POST", {
            token: token,
            new_password: newPassword
          });

          alertBanner.textContent = response.message || "Password updated successfully! Redirecting...";
          alertBanner.className = "alert-success";
          alertBanner.classList.remove("hidden");

          // Hide form on success and redirect to login
          form.style.display = "none";

          setTimeout(() => {
            window.location.href = "auth.html";
          }, 2000);
        } catch (err) {
          alertBanner.textContent = err.message || "Failed to reset password. Token may be expired.";
          alertBanner.className = "alert-error";
          alertBanner.classList.remove("hidden");
        }
      });
    });
  </script>
</body>
</html>
